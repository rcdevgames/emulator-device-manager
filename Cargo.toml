[package]
name = "emulator-panel"
version = "0.1.0"
edition = "2021"
description = "Single-binary Android device manager GUI: AVD lifecycle, adb devices, logcat, install, screenshot, port forward."

[[bin]]
name = "devmgr"
path = "src/main.rs"

[dependencies]
anyhow = "1"
eframe = { version = "0.37", default-features = false, features = [
    "default_fonts",
    "glow",
    "wayland",
    "x11",
] }
png = "0.17"
rfd = "0.17"

[build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
